<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ipswich Town vs. Sunderland</title>

  <style>
    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }

    .video-container {
      width: 100%;
      max-width: 855px;
    }

    video {
      display: block;
      width: 100%;
      border-radius: 10px;
    }

    .iframe-container {
      width: 100%;
      margin-top: 20px;
    }

    .iframe-container iframe {
      display: block;
      width: 100%;
      height: 480px;
      border: 0;
      border-radius: 10px;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      margin-top: 20px;
    }

    .iframe-container iframe {
      display: block;
      width: 100%;
      height: 480px;
      border: 0;
      border-radius: 10px;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
    }

    .play-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 30px;
      padding-left: 4px;
    }
  </style>

</head>

<body>

  <div class="video-container">
    <div class="iframe-container">
      <iframe
        src="https://embedindia.st/embed/pl/2026-08-22/ips-sun"
        width="100%"
        height="480"
        frameborder="0"
        allowfullscreen
        loading="lazy">
      </iframe>

      <!-- Overlay hanya menangkap klik pertama untuk membuka iklan -->
      <div id="playOverlay" class="play-overlay" aria-label="Play">
        <span class="play-button">▶</span>
      </div>
    </div>

    <script>
      const playOverlay = document.getElementById("playOverlay");
      let adOpened = false;

      playOverlay.addEventListener("click", function () {
        if (!adOpened) {
          adOpened = true;

          window.open(
            "https://xvidey.cam/film",
            "_blank",
            "noopener,noreferrer"
          );
        }

        // Hapus overlay agar klik berikutnya masuk ke player iframe.
        playOverlay.remove();
      });
    </script>
  </div>
  </div>
