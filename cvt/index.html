<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparing Stream</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:-apple-system,Segoe UI,sans-serif;background:#09090b;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.bg-image{ position:fixed; inset:0; background:url('https://cdn.jsdelivr.net/gh/videacam/xvidey@main/assets/images/cdv.png') center center / cover no-repeat; transform:scale(1.1); filter:blur(1px); opacity:.45; animation:zoom 12s ease-in-out infinite alternate; z-index:-4; }.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:-3}.glow:before,.glow:after{content:'';position:fixed;border-radius:50%;filter:blur(90px);opacity:.18;z-index:-2}.glow:before{width:40vmax;height:40vmax;background:#2563eb;left:-10vmax;top:-10vmax}.glow:after{width:35vmax;height:35vmax;background:#7c3aed;right:-10vmax;bottom:-10vmax}@keyframes zoom{to{transform:scale(1.16)}}.card{width:360px;max-width:92%;padding:34px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:28px;text-align:center;transition:.45s}.logo{width:82px;height:82px;margin:auto;border-radius:22px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:grid;place-items:center}.logo svg{width:34px;fill:#fff}.spin{width:46px;height:46px;margin:24px auto;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.prog{height:4px;background:#222;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#fff;transition:width .45s}.bottom{display:flex;justify-content:space-between;color:#aaa;font-size:13px;margin-top:12px}.fade{opacity:0;transform:scale(.98);filter:blur(8px)}</style></head><body><div class='bg-image'></div><div class='overlay'></div><div class='glow'></div><div class='card' id='card'><div class='logo'><svg viewBox='0 0 24 24'><path d='M8 5v14l11-7z'/></svg></div><div class='spin'></div><h2>Preparing your stream</h2><p id='status'>Connecting...</p><div class='prog'><div class='bar' id='bar'></div></div><div class='bottom'><span id='percent'>0%</span><span>Secure Playback</span></div></div><script>const url='https://example.com';const steps=[['Connecting...',12,350],['Finding fastest server...',34,500],['Preparing playback...',58,600],['Optimizing quality...',82,550],['Buffering stream...',96,450],['Ready',100,250]];const s=document.getElementById('status'),b=document.getElementById('bar'),p=document.getElementById('percent'),c=document.getElementById('card');let i=0;function go(){if(i>=steps.length){c.classList.add('fade');return setTimeout(()=>location.replace(url),450)}const x=steps[i++];s.textContent=x[0];b.style.width=x[1]+'%';p.textContent=x[1]+'%';setTimeout(go,x[2])}setTimeout(go,300);</script></body></html>
